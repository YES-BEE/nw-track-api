services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nwtrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  api:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://database:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      FACTORY_NAME: ${FACTORY_NAME}
      FACTORY_TIMEZONE: ${FACTORY_TIMEZONE:-Asia/Kolkata}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://${BIND_ADDRESS:-127.0.0.1}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${ALLOWED_ORIGINS:-http://${BIND_ADDRESS:-127.0.0.1}}}
      TRANSPORT_PROVIDER: simulator
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LOG_FILE: /var/log/nwtrack/nwtrack.log
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-20MB}
      LOG_HISTORY_DAYS: ${LOG_HISTORY_DAYS:-30}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-2GB}
    volumes:
      - ./logs/api:/var/log/nwtrack
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [backend, edge]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - ./nginx/${NGINX_TEMPLATE:-http.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./deployment/certificates:/etc/nginx/certs:ro
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-nowash-track.com}
      NGINX_ENVSUBST_FILTER: ^APP_DOMAIN$
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  dns:
    profiles: [https]
    image: coredns/coredns:1.12.4
    restart: unless-stopped
    command: ["-conf", "/etc/coredns/Corefile"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-nowash-track.com}
      BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:53:53/udp"
      - "${BIND_ADDRESS:-127.0.0.1}:53:53/tcp"
    volumes:
      - ./deployment/dns/Corefile:/etc/coredns/Corefile:ro
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  nwtrack-db:

networks:
  backend:
    internal: true
  edge:
