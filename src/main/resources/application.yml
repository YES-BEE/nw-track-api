server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: nwtrack-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nwtrack}
    username: ${DB_USERNAME:nwtrack_app}
    password: ${DB_PASSWORD:nwtrack_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
nwtrack:
  factory-name: ${FACTORY_NAME:NW Track Development Factory}
  storage-token-tracking-enabled: ${STORAGE_TOKEN_TRACKING_ENABLED:true}
  security:
    jwt-secret: ${JWT_SECRET_BASE64:bm90LWZvci1wcm9kdWN0aW9uLWNoYW5nZS10aGlzLTMyLWJ5dGUta2V5ISE=}
    issuer: ${JWT_ISSUER:nwtrack-api}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
  transport:
    provider: ${TRANSPORT_PROVIDER:simulator}
    simulator-step-delay: ${TRANSPORT_SIMULATOR_STEP_DELAY:1s}
