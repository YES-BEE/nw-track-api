server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: nwtrack-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
nwtrack:
  factory-name: ${FACTORY_NAME:NW Track Development Factory}
  factory-timezone: ${FACTORY_TIMEZONE:Asia/Kolkata}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${ALLOWED_ORIGINS:http://localhost:8080}}
  security:
    jwt-secret: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:nwtrack-api}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}
  transport:
    provider: ${TRANSPORT_PROVIDER:simulator}
    simulator-step-delay: ${TRANSPORT_SIMULATOR_STEP_DELAY:1s}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
logging:
  file:
    name: ${LOG_FILE:logs/api/nwtrack.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:20MB}
      max-history: ${LOG_HISTORY_DAYS:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:2GB}
      clean-history-on-start: true
